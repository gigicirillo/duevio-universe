name: Publish Duevio
on:
  push:
    branches: [gh-pages]
    paths:
      - '**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: duevio-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify production assets
        run: |
          test -s index.html
          test -s content.json
          for clip in drop arrival luminescence; do
            test "$(find "frames/$clip" -name 'frame_*.jpg' | wc -l)" -eq 150
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
